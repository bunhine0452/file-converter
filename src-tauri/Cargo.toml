[package]
name = "file-converter"
version = "0.1.0"
description = "로컬에서만 동작하는 설치형 파일 변환기"
authors = ["bunhine0452"]
license = "MIT"
repository = "https://github.com/bunhine0452/file-converter"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "file_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 런타임 자산(LibreOffice·JRE·H2Orestart) 온디맨드 설치용.
# 버전은 Cargo.lock 이 이미 해석한 값에 맞춰 중복 빌드를 피한다.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
] }
tokio = { version = "1", features = ["fs", "io-util", "net", "time", "rt"] }
futures-util = "0.3"
sha2 = "0.10"
tempfile = "3"
which = "8"

# 문서 프리플라이트: HWP5 는 OLE 복합문서, HWPX 는 ZIP.
cfb = "0.7"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
